<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BugTrack</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- Entry point: sends the visitor to the dashboard (signed in) or the login page. -->
  <noscript>This app needs JavaScript. Please enable it and open it through a local server (e.g. VS Code Live Server).</noscript>
  <script type="module">
    import { initStorage, getCurrentUser } from './js/storage.js';
    initStorage();
    window.location.replace(getCurrentUser() ? 'pages/dashboard.html' : 'pages/login.html');
  </script>
</body>
</html>
