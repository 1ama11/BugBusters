<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects · BugTrack</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="is-loading">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="main-content" tabindex="-1">
        <div class="page-header">
          <div>
            <h2 class="page-header__title">Projects</h2>
            <p class="page-header__subtitle">Every software project in the workspace, with its team and bug health.</p>
          </div>
          <div class="page-header__actions">
            <button type="button" class="btn btn--primary" id="new-project-btn" hidden>
              <span data-icon="plus"></span>New project
            </button>
          </div>
        </div>

        <div class="projects-toolbar">
          <div class="segmented" id="status-tabs" role="group" aria-label="Filter by status"></div>

          <div class="projects-toolbar__right">
            <div class="input-group projects-toolbar__search">
              <span class="input-group__icon" data-icon="search"></span>
              <label class="sr-only" for="project-search">Search projects</label>
              <input class="input" type="search" id="project-search" placeholder="Search projects…" autocomplete="off">
            </div>
            <label class="sr-only" for="project-sort">Sort projects</label>
            <select class="select projects-toolbar__sort" id="project-sort">
              <option value="updated">Recently updated</option>
              <option value="name">Name (A–Z)</option>
              <option value="bugs">Most bugs</option>
              <option value="open">Most open bugs</option>
            </select>
            <label class="check check--pill">
              <input type="checkbox" id="mine-only">
              <span>My projects</span>
            </label>
          </div>
        </div>

        <p class="text-sm text-subtle results-meta" id="project-count" aria-live="polite"></p>
        <div class="projects-grid" id="projects-grid"></div>
        <div class="card" id="projects-empty" hidden></div>
      </main>
    </div>
  </div>

  <!-- Project details -->
  <dialog class="modal modal--lg" id="project-view-modal" aria-labelledby="project-view-title">
    <div class="modal__header">
      <div>
        <p class="modal__eyebrow" id="project-view-eyebrow"></p>
        <h2 class="modal__title" id="project-view-title">Project</h2>
      </div>
      <button type="button" class="icon-btn" data-close-modal aria-label="Close" data-icon="x" data-icon-size="18"></button>
    </div>
    <div class="modal__body" id="project-view-body"></div>
    <div class="modal__footer">
      <button type="button" class="btn btn--secondary" data-close-modal>Close</button>
      <a class="btn btn--secondary" id="project-view-bugs" href="bugs.html">View all bugs</a>
      <button type="button" class="btn btn--primary" id="project-view-edit" hidden>Edit project</button>
    </div>
  </dialog>

  <!-- Create / edit project -->
  <dialog class="modal modal--lg" id="project-form-modal" aria-labelledby="project-form-title">
    <form id="project-form" novalidate>
      <div class="modal__header">
        <div>
          <h2 class="modal__title" id="project-form-title">New project</h2>
          <p class="modal__subtitle" id="project-form-subtitle">Projects group bugs and the people who work on them.</p>
        </div>
        <button type="button" class="icon-btn" data-close-modal aria-label="Close" data-icon="x" data-icon-size="18"></button>
      </div>
      <div class="modal__body form-grid">
        <input type="hidden" name="id">
        <div class="form-row form-row--name">
          <div class="field">
            <label class="field__label" for="project-name">Project name<span class="required" aria-hidden="true">*</span></label>
            <input class="input" type="text" id="project-name" name="name" maxlength="60" placeholder="e.g. Customer Portal" required>
            <p class="field-error"></p>
          </div>
          <div class="field">
            <label class="field__label" for="project-key">Key<span class="required" aria-hidden="true">*</span></label>
            <input class="input mono" type="text" id="project-key" name="key" maxlength="5" placeholder="CP" required autocomplete="off">
            <p class="field__hint">2–5 letters/digits, e.g. CP</p>
            <p class="field-error"></p>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="project-description">Description<span class="required" aria-hidden="true">*</span></label>
          <textarea class="textarea" id="project-description" name="description" maxlength="300" placeholder="What is this project about?" required></textarea>
          <p class="field__hint"><span id="description-count">0</span>/300 characters</p>
          <p class="field-error"></p>
        </div>

        <div class="form-row">
          <div class="field">
            <label class="field__label" for="project-status">Status</label>
            <select class="select" id="project-status" name="status"></select>
            <p class="field-error"></p>
          </div>
          <div class="field">
            <label class="field__label" for="project-manager">Project manager<span class="required" aria-hidden="true">*</span></label>
            <select class="select" id="project-manager" name="managerId"></select>
            <p class="field__hint" id="manager-hint"></p>
            <p class="field-error"></p>
          </div>
        </div>

        <fieldset class="field member-picker">
          <legend class="field__label">Team members</legend>
          <div class="member-picker__list" id="member-list"></div>
          <p class="field__hint">Developers and testers who work on this project.</p>
        </fieldset>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--secondary" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn--primary" id="project-submit">Create project</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="../js/projects.js"></script>
</body>
</html>
