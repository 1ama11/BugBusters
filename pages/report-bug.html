<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Bug · BugTrack</title>
  
  <!-- Shell Fonts and Icons -->
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/bugs.css">
</head>
<body class="is-loading">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="main-content" tabindex="-1">
        <div class="bugs-container">
          
          <!-- Top Header Navigation -->
          <header class="bugs-top-nav">
            <div class="bugs-brand">
              <span class="bugs-brand-dot"></span>
              <span>BugTrack</span>
            </div>
            <nav class="bugs-nav-tabs">
              <a href="bugs.html" class="bugs-nav-link">Bug List</a>
              <a href="report-bug.html" class="bugs-nav-link active">Report Bug</a>
            </nav>
          </header>

          <div class="bugs-page-header">
            <div>
              <h1>Report a Bug</h1>
              <p>Fill out the details below to log a new bug.</p>
            </div>
          </div>

          <form id="reportBugForm" class="report-bug-form" novalidate>
            <div class="form-group">
              <label for="bugTitle">Bug Title <span class="required-mark">*</span></label>
              <input type="text" id="bugTitle" name="title" required placeholder="Brief title of the bug">
            </div>

            <div class="form-group">
              <label for="bugDescription">Description <span class="required-mark">*</span></label>
              <textarea id="bugDescription" name="description" required placeholder="Detailed description of the issue"></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="bugSeverity">Severity <span class="required-mark">*</span></label>
                <select id="bugSeverity" name="severity" required>
                  <option value="">Select severity</option>
                  <option value="Low">Low</option>
                  <option value="Medium">Medium</option>
                  <option value="High">High</option>
                  <option value="Critical">Critical</option>
                </select>
              </div>

              <div class="form-group">
                <label for="bugPriority">Priority <span class="required-mark">*</span></label>
                <select id="bugPriority" name="priority" required>
                  <option value="">Select priority</option>
                  <option value="Low">Low</option>
                  <option value="Medium">Medium</option>
                  <option value="High">High</option>
                  <option value="Critical">Critical</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="bugProject">Project <span class="required-mark">*</span></label>
              <select id="bugProject" name="projectId" required>
                <option value="">Select project</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" id="submitBugBtn" class="btn-submit-bug">Submit Bug</button>
              <button type="button" id="cancelBugBtn" class="btn-cancel-bug">Cancel</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/bugs.js"></script>
  <script type="module">
    import { initLayout } from '../js/app.js';
    initLayout({ pageId: 'report-bug', permission: 'bugs.report' });
  </script>
</body>
</html>
