<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports & Analytics · BugTrack</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <!-- Chart.js (global `Chart`), used by js/reports.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</head>
<body class="is-loading">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="main-content" tabindex="-1">
        <div class="page-header">
          <div>
            <h2 class="page-header__title">Reports &amp; Analytics</h2>
            <p class="page-header__subtitle">Analyze bug trends and resolution performance.</p>
          </div>
        </div>

        <section class="stats-grid" aria-label="Report statistics">
          <article class="card stat-card">
            <p class="stat-card__label"><span data-icon="calendar"></span>Avg. resolution time</p>
            <p class="stat-card__value" id="stat-resolution">—</p>
          </article>
          <article class="card stat-card">
            <p class="stat-card__label"><span data-icon="alert"></span>Critical bugs open</p>
            <p class="stat-card__value" id="stat-critical">0</p>
          </article>
          <article class="card stat-card">
            <p class="stat-card__label"><span data-icon="bug"></span>Reported this week</p>
            <p class="stat-card__value" id="stat-week">0</p>
          </article>
          <article class="card stat-card">
            <p class="stat-card__label"><span data-icon="check-circle"></span>Resolution rate</p>
            <p class="stat-card__value" id="stat-rate">—</p>
            <p class="stat-card__hint" id="stat-rate-hint"></p>
          </article>
        </section>

        <div class="dash-grid">
          <section class="card" aria-labelledby="trend-title">
            <div class="card__header">
              <div>
                <h3 class="card__title" id="trend-title">Bug trends</h3>
                <p class="card__subtitle">Reported vs. resolved, last 6 months</p>
              </div>
            </div>
            <div class="card__body">
              <div class="chart-box"><canvas id="trend-chart" role="img" aria-label="Line chart of bugs reported and resolved per month"></canvas></div>
            </div>
          </section>

          <section class="card" aria-labelledby="severity-title">
            <div class="card__header">
              <h3 class="card__title" id="severity-title">Bugs by severity</h3>
            </div>
            <div class="card__body">
              <div class="chart-box"><canvas id="severity-chart" role="img" aria-label="Doughnut chart of bugs by severity"></canvas></div>
            </div>
          </section>
        </div>

        <section class="card mt-6" aria-labelledby="projects-title">
          <div class="card__header">
            <h3 class="card__title" id="projects-title">Bugs by project</h3>
          </div>
          <div class="table-wrapper" id="project-table">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">Project</th>
                  <th scope="col" class="num">Total</th>
                  <th scope="col" class="num">Open</th>
                  <th scope="col" class="num">Critical open</th>
                  <th scope="col">Done</th>
                </tr>
              </thead>
              <tbody id="project-rows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="../js/reports.js"></script>
</body>
</html>
